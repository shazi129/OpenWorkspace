<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工具示例</title>
    <style>
      body { margin: 0; padding: 2rem; color: #172033; font: 16px/1.6 system-ui, sans-serif; }
      button { padding: 0.6rem 1rem; border: 0; border-radius: 0.5rem; background: #087fe7; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>工具示例</h1>
    <p>HTML 工具通过沙箱 iframe 加载，不会直接插入主页面。</p>
    <button id="demo-button" type="button">点击测试</button>
    <p id="result" aria-live="polite"></p>
    <script>
      document.querySelector("#demo-button").addEventListener("click", () => {
        document.querySelector("#result").textContent = "工具运行正常。";
      });
    </script>
  </body>
</html>
